<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F1F2EF">
<title>Yayın Akışı</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%234E8A73' stroke-width='3'/%3E%3Cpath d='M10 16.5l4 4 8-9' fill='none' stroke='%234E8A73' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}

:root{
  --zemin:#F1F2EF; --yuzey:#F8F9F7; --murekkep:#2C3331; --soluk:#747D79; --cizgi:#E0E3DE;
  --yesil:#4E8A73; --kiremit:#B8614A; --amber:#9C7A2E; --odak:#4A7FA8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --zemin:#1C2120; --yuzey:#232928; --murekkep:#DCE2DF; --soluk:#8F9995; --cizgi:#2F3634;
    --yesil:#80BBA3; --kiremit:#DF917A; --amber:#D0AD66; --odak:#8BB8DA;
  }
}
:root[data-theme="dark"]{
  --zemin:#1C2120; --yuzey:#232928; --murekkep:#DCE2DF; --soluk:#8F9995; --cizgi:#2F3634;
  --yesil:#80BBA3; --kiremit:#DF917A; --amber:#D0AD66; --odak:#8BB8DA;
}
*{box-sizing:border-box}
body{background:var(--zemin);color:var(--murekkep);font:15px/1.55 Figtree,system-ui,-apple-system,sans-serif;padding:0 20px;padding-block:36px 72px;-webkit-font-smoothing:antialiased}
.sayfa{max-width:640px;margin:0 auto;display:grid;gap:44px}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--odak);outline-offset:2px;border-radius:4px}

header{display:grid;gap:10px}
.kas{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--soluk)}
h1{font-weight:600;font-size:28px;line-height:1.15;margin:0;letter-spacing:-.01em;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;font-size:14px;color:var(--soluk)}
.meta b{font-weight:500;color:var(--murekkep)}
.durum{margin-left:auto;font-size:13px;display:flex;align-items:center;gap:6px}
.durum::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--soluk)}
.durum.ok::before{background:var(--yesil)}
.durum.hata{color:var(--kiremit)} .durum.hata::before{background:var(--kiremit)}
.durum button{appearance:none;background:none;border:0;padding:0;color:var(--kiremit);text-decoration:underline;cursor:pointer}
.cubuk{height:3px;border-radius:2px;background:var(--cizgi);overflow:hidden;margin-top:4px}
.cubuk i{display:block;height:100%;background:var(--yesil);transition:width .3s}

h2{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--soluk);margin:0 0 6px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h2 .mono{font-weight:400;letter-spacing:0;text-transform:none}

/* beklenenler */
.liste{display:grid}
.bk{display:grid;grid-template-columns:44px 1fr auto;align-items:start;border-top:1px solid var(--cizgi)}
.bk:first-child{border-top:0}
.bk .tik{appearance:none;background:none;border:0;padding:0;margin-left:-11px;cursor:pointer;display:grid;place-items:center;min-height:48px;touch-action:manipulation}
.bk .bkmetin{padding:12px 0;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline;min-width:0}
.bk .tik span{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--amber)}
.bk.geldi .tik span{background:var(--yesil);border-color:var(--yesil)}
.bk .kim{font-weight:500}
.bk .ne{color:var(--soluk);font-size:14px;grid-column:1/-1}
.bk .son{font-size:12px;color:var(--amber)}
.bk.geldi .kim{color:var(--soluk);text-decoration:line-through}
.bk.geldi .son{color:var(--yesil)}

/* akış */
.gun{display:grid;grid-template-columns:76px 1fr;gap:14px;padding:14px 0;border-top:1px solid var(--cizgi)}
.gun:first-of-type{border-top:0}
.tarih{display:grid;align-content:start;gap:1px;padding-top:1px}
.tarih .g{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--soluk)}
.tarih .t{font-size:15px}
.gun.bugun .g{color:var(--kiremit);font-weight:600}
.isler{display:grid;gap:12px}
.is{display:grid;grid-template-columns:44px 1fr auto;align-items:start}
.tikalan{display:grid;place-items:start center;margin:-10px 0 -10px -13px;padding:12px 0;cursor:pointer;touch-action:manipulation}
.is input{appearance:none;margin:0;width:20px;height:20px;border:1.5px solid var(--soluk);border-radius:50%;cursor:pointer;display:grid;place-content:center;background:transparent}
.is input::after{content:"";width:8px;height:4px;border-left:1.5px solid var(--zemin);border-bottom:1.5px solid var(--zemin);transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.is input:checked{background:var(--yesil);border-color:var(--yesil)}
.is input:checked::after{opacity:1}
.is input:disabled{cursor:default}
.metin{display:grid;gap:2px;min-width:0}
.duzenle{appearance:none;background:none;border:0;margin:-8px -8px 0 6px;padding:8px;font-size:12.5px;color:var(--soluk);cursor:pointer;touch-action:manipulation;text-decoration:underline;text-decoration-color:var(--cizgi);text-underline-offset:3px}
.duzenle:hover{color:var(--murekkep);text-decoration-color:currentColor}
.bk .duzenle{margin-top:4px}
.baslik{font-weight:500;line-height:1.4}
.detay{color:var(--soluk);font-size:14px;max-width:60ch}
.etiket{font-size:12.5px;color:var(--soluk)}
.etiket .acil{color:var(--kiremit);font-weight:500}
.etiket .bekle{color:var(--amber)}
.is.bitti .baslik{color:var(--soluk);text-decoration:line-through;text-decoration-color:var(--cizgi)}
.is.bitti .detay,.is.bitti .etiket{display:none}

.ekle{appearance:none;background:none;border:0;padding:8px 0 0;color:var(--soluk);font-size:14px;cursor:pointer}
.ekle:hover{color:var(--murekkep)}
.salt .ekle,.salt .form-ac{display:none}

/* form */
.form{display:grid;gap:12px;padding:14px;margin:6px 0;background:var(--yuzey);border:1px solid var(--cizgi);border-radius:10px}
.ikili{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.alan{display:grid;gap:4px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--soluk)}
.form input[type=text],.form select,.form textarea{font:inherit;font-size:16px;color:var(--murekkep);background:var(--zemin);border:1px solid var(--cizgi);border-radius:7px;padding:7px 9px;width:100%;text-transform:none;letter-spacing:0}
.form textarea{min-height:56px;resize:vertical}
.secim{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px}
.secim label{display:flex;align-items:center;gap:6px;cursor:pointer}
.alt{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.birincil{appearance:none;font-weight:600;font-size:14px;color:var(--zemin);background:var(--murekkep);border:0;border-radius:7px;padding:7px 14px;cursor:pointer}
.ikincil{appearance:none;background:none;border:0;padding:7px 8px;font-size:14px;color:var(--soluk);cursor:pointer}
.sil{margin-left:auto;color:var(--kiremit)}
.uyari{font-size:13px;color:var(--kiremit)}

@media (max-width:520px){
  .gun{grid-template-columns:1fr;gap:8px}
  .tarih{grid-auto-flow:column;justify-content:start;gap:8px;align-items:baseline}
  .ikili{grid-template-columns:1fr}
  .durum{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){.cubuk i{transition:none}}

/* giriş */
.giris{max-width:360px;margin:12vh auto 0;display:grid;gap:14px}
.giris h1{font-size:26px}
.giris p{margin:0;color:var(--soluk);font-size:14px}
.giris form{display:grid;gap:10px}
.giris input{font:inherit;font-size:16px;color:var(--murekkep);background:var(--yuzey);border:1px solid var(--cizgi);border-radius:8px;padding:10px 12px;width:100%}
.giris .birincil{padding:10px 14px;font-size:15px}
.cikis{justify-self:start;appearance:none;background:none;border:0;padding:0;color:var(--soluk);font-size:13px;cursor:pointer;text-decoration:underline;text-decoration-color:var(--cizgi)}


/* aylar */
.aylar{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-inline:-20px;padding-inline:20px;-webkit-overflow-scrolling:touch}
.aylar::-webkit-scrollbar{display:none}
.ay{appearance:none;flex:none;border:1px solid transparent;background:none;border-radius:999px;padding:6px 13px;font-size:14px;color:var(--soluk);white-space:nowrap;cursor:pointer;touch-action:manipulation}
.ay:hover{color:var(--murekkep)}
.ay[aria-current="true"]{background:var(--yuzey);border-color:var(--cizgi);color:var(--murekkep);font-weight:600}
.bilgi{font-size:13.5px;color:var(--soluk);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.bilgi button{appearance:none;background:none;border:0;padding:0;color:var(--murekkep);text-decoration:underline;cursor:pointer;font-size:13.5px}

/* haftalar */
.haftalar{display:grid}
.hafta{border-top:1px solid var(--cizgi)}
.hafta:first-child{border-top:0}
.hafta-bas{appearance:none;background:none;border:0;width:100%;display:grid;grid-template-columns:16px 1fr auto;gap:10px;align-items:baseline;padding:15px 0;text-align:left;cursor:pointer;touch-action:manipulation}
.okisaret{display:inline-block;width:7px;height:7px;border-right:1.5px solid var(--soluk);border-bottom:1.5px solid var(--soluk);transform:translateY(-2px) rotate(-45deg);transition:transform .15s}
.hafta.acik .okisaret{transform:translateY(-4px) rotate(45deg)}
.hafta-ad{font-size:16px;font-weight:500;display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}
.hafta-ad .simdi{font-size:12px;font-weight:600;color:var(--kiremit);letter-spacing:.04em;text-transform:uppercase}
.hafta-ozet{font-size:13px;color:var(--soluk);white-space:nowrap}
.hafta-ozet .acil{color:var(--kiremit)}
.hafta-ic{padding:0 0 16px 26px}
.hafta-ic .gun:first-child{border-top:0;padding-top:2px}
.bos{color:var(--soluk);font-size:14px;padding:4px 0 2px}
.devir{font-size:12.5px;color:var(--soluk);font-style:italic}
.eylemler{display:grid;justify-items:end}
.hizli{display:flex;flex-wrap:wrap;gap:6px}
.hizli button{appearance:none;border:1px solid var(--cizgi);background:var(--zemin);border-radius:999px;padding:4px 11px;font-size:13.5px;color:var(--murekkep);cursor:pointer}
.form input[type=date]{font:inherit;font-size:16px;color:var(--murekkep);background:var(--zemin);border:1px solid var(--cizgi);border-radius:7px;padding:7px 9px;width:100%;min-height:40px;text-transform:none;letter-spacing:0}
.form .soru{font-size:14px;margin:0}
@media (max-width:520px){ .hafta-ic{padding-left:0} }
@media (prefers-reduced-motion:reduce){.okisaret{transition:none}}

</style>
</head>
<body>
<main class="sayfa" id="app"></main>
<script>
const SURUM = "20260915111554";
const SUPA = "https://qthlfkudzqkswhzipazd.supabase.co";
const ANAHTAR = "sb_publishable_k5iOBRf8W7zUCSqK9HVxkg_3uH6KmI-";
const K_SIFRE = "akis-sifre", K_KUYRUK = "akis-kuyruk", K_ACIK = "akis-acik-haftalar";

const app = document.getElementById("app");
let sifre = depo(K_SIFRE) || "";
let sunucu = null, surum = 0, S = null;
let durum = "ok", gonderiliyor = false, form = null, girisHata = "", bilgi = null;
let secAy = ayAnahtar(new Date());
let acik = new Set((() => { try { return JSON.parse(depo(K_ACIK) || "[]"); } catch { return []; } })());

function depo(k, v){
  try { if (v === undefined) return localStorage.getItem(k); v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {}
  return null;
}
const kuyruk = () => { try { return JSON.parse(depo(K_KUYRUK) || "[]"); } catch { return []; } };
const kuyrukYaz = q => depo(K_KUYRUK, q.length ? JSON.stringify(q) : null);

async function rpc(ad, govde){
  const r = await fetch(SUPA + "/rest/v1/rpc/" + ad, {
    method: "POST",
    headers: { apikey: ANAHTAR, "Content-Type": "application/json" },
    body: JSON.stringify(govde),
  });
  const j = await r.json().catch(() => null);
  if (!r.ok) { const e = new Error(j?.message || "hata"); e.kod = j?.message || "hata"; throw e; }
  return j;
}

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const yeniId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
const kopya = o => JSON.parse(JSON.stringify(o));

/* ---- tarih ---- */
const AYLAR = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const GUNLER = ["Paz","Pzt","Sal","Çar","Per","Cum","Cmt"];
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const tarihOku = t => { const [y, m, g] = t.split("-").map(Number); return new Date(y, m - 1, g); };
const gunEkle = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
function ayAnahtar(d){ return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; }
const ayAdi = k => { const [y, m] = k.split("-").map(Number); return `${AYLAR[m - 1]} ${y}`; };
const ayKaydir = (k, n) => { const [y, m] = k.split("-").map(Number); return ayAnahtar(new Date(y, m - 1 + n, 1)); };
const bugun = () => iso(new Date());
/* Türkçe ek: ek("Eylül", "e") → "Eylül'e", ek("Mart", "den") → "Mart'tan" */
function ek(kelime, tur){
  const sesli = (kelime.match(/[aeıioöuü]/gi) || ["e"]).pop().toLowerCase();
  const ince = "eiöü".includes(sesli);
  if (tur === "e") return `${kelime}'${ince ? "e" : "a"}`;
  const sert = /[çfhkpsşt]$/i.test(kelime);
  return `${kelime}'${sert ? "t" : "d"}${ince ? "en" : "an"}`;
}
const kisaTarih = t => { const d = tarihOku(t); return `${d.getDate()} ${AYLAR[d.getMonth()]}`; };
const pazartesi = d => gunEkle(d, -((d.getDay() + 6) % 7));
const isAy = i => i.tarih ? i.tarih.slice(0, 7) : i.ay;

function haftalar(ay){
  const [y, m] = ay.split("-").map(Number);
  const ilk = new Date(y, m - 1, 1), son = new Date(y, m, 0);
  const liste = [];
  for (let bas = pazartesi(ilk); bas <= son; bas = gunEkle(bas, 7)) {
    const a = bas < ilk ? ilk : bas, b = gunEkle(bas, 6) > son ? son : gunEkle(bas, 6);
    liste.push({ anahtar: iso(bas), bas: iso(a), bit: iso(b),
      ad: a.getDate() === b.getDate() ? `${a.getDate()} ${AYLAR[m - 1]}` : `${a.getDate()}–${b.getDate()} ${AYLAR[m - 1]}` });
  }
  return liste;
}

function gunGruplari(isler){
  const m = new Map();
  for (const i of isler) {
    const k = i.tarih + "|" + (i.bitis || "");
    if (!m.has(k)) m.set(k, { tarih: i.tarih, bitis: i.bitis, isler: [] });
    m.get(k).isler.push(i);
  }
  return [...m.values()].sort((a, b) => a.tarih < b.tarih ? -1 : a.tarih > b.tarih ? 1 : 0);
}
function gunEtiket(g){
  const a = tarihOku(g.tarih);
  if (!g.bitis || g.bitis === g.tarih) return { g: GUNLER[a.getDay()], t: String(a.getDate()) };
  const b = tarihOku(g.bitis);
  return { g: `${GUNLER[a.getDay()]}–${GUNLER[b.getDay()]}`, t: `${a.getDate()}–${b.getDate()}` };
}
const bugunIcinde = (bas, bit) => { const t = bugun(); return bas <= t && t <= (bit || bas); };

/* ---- veri: sunucudaki hâl + henüz gitmemiş değişiklikler ---- */
function uygula(d, op){
  if (!op || typeof op.t !== "string" || !op.id) return;
  const liste = op.t.startsWith("bk") ? "bekleyenler" : "isler";
  if (op.t === "is" || op.t === "bk") {
    const k = d[liste].findIndex(x => x.id === op.id);
    if (k >= 0) d[liste][k] = { ...d[liste][k], ...op.veri };
    else if (op.yeni) d[liste].push({ id: op.id, ...op.veri });
  } else d[liste] = d[liste].filter(x => x.id !== op.id);
}
function yeniden(){ S = kopya(sunucu); for (const op of kuyruk()) uygula(S, op); }
function degistir(op){ kuyrukYaz([...kuyruk(), op]); uygula(S, op); ciz(); gonder(); }

async function gonder(){
  if (gonderiliyor) return;
  gonderiliyor = true;
  try {
    let q;
    while ((q = kuyruk()).length) {
      durum = "gonderiliyor"; ustDurum();
      try {
        const r = await rpc("akis_islem", { sifre, op: q[0] });
        sunucu = r.veri; surum = r.surum;
      } catch (e) {
        if (e.kod === "sifre_yanlis") return cikis("Şifre değişmiş, yenisini gir.");
        if (e.kod !== "gecersiz_islem") { durum = "baglanti"; ustDurum(); setTimeout(gonder, 5000); return; }
      }
      kuyrukYaz(kuyruk().slice(1));
    }
    durum = "ok";
    if (!form) { yeniden(); ciz(); } else ustDurum();
  } finally { gonderiliyor = false; }
}

async function yokla(){
  if (!sifre || !sunucu || gonderiliyor || kuyruk().length || form || document.hidden) return;
  try {
    const s = await rpc("akis_surum", { sifre });
    if (s === surum) { if (durum !== "ok") { durum = "ok"; ustDurum(); } return; }
    const r = await rpc("akis_oku", { sifre });
    if (form || kuyruk().length) return;
    sunucu = r.veri; surum = r.surum; durum = "ok"; yeniden(); ciz();
  } catch (e) {
    if (e.kod === "sifre_yanlis") return cikis("Şifre değişmiş, yenisini gir.");
    durum = "baglanti"; ustDurum();
  }
}

function hataBildir(hata, yer){
  let q = null; try { q = JSON.parse(depo(K_KUYRUK) || "null"); } catch { q = depo(K_KUYRUK); }
  rpc("akis_hata_yaz", { mesaj: `${yer}: ${hata?.message || hata}`, ayrinti: {
    stack: String(hata?.stack || "").slice(0, 3000), ua: navigator.userAgent, surum: SURUM, ekran: innerWidth,
    kuyruk: q, acik: depo(K_ACIK), secAy, veriAnahtarlari: sunucu ? Object.keys(sunucu) : null,
  } }).catch(() => {});
}

function tazeYukle(neden){
  let son = 0;
  try { son = +sessionStorage.getItem("akis-taze") || 0; } catch {}
  if (Date.now() - son < 30000) return false;
  try { sessionStorage.setItem("akis-taze", Date.now()); } catch {}
  console.warn("Sayfa yenileniyor:", neden);
  location.replace(location.pathname + "?v=" + Date.now());
  return true;
}

async function giris(deneme){
  const r = await rpc("akis_oku", { sifre: deneme });
  sifre = deneme; depo(K_SIFRE, deneme);
  sunucu = r.veri; surum = r.surum;
  try { yeniden(); ciz(); }
  catch (hata) {
    hataBildir(hata, "acilis");
    // Bu cihazda kalmış yerel kayıtlar (açık haftalar, gönderilmemiş değişiklikler) bozuksa onlarsız aç.
    try { acik = new Set(); depo(K_ACIK, null); kuyrukYaz([]); secAy = ayAnahtar(new Date()); form = null; S = kopya(sunucu); ciz(); return; }
    catch (hata2) { hataBildir(hata2, "yereller-temizlendi"); const e = new Error("cizim"); e.kod = "cizim"; e.asil = hata2; throw e; }
  }
  if (kuyruk().length) gonder();
}
function hataMesaji(err){
  if (err.kod === "sifre_yanlis") return "Şifre yanlış.";
  if (err.kod === "cizim") return "Sayfa açılırken bir sorun oldu. Sayfayı yenile (bilgisayarda Cmd+R, telefonda aşağı çek).";
  return "Bağlanamadı, interneti kontrol edip tekrar dene.";
}
function cikis(mesaj){
  sifre = ""; depo(K_SIFRE, null); sunucu = null; S = null; form = null;
  girisHata = mesaj || ""; cizGiris();
}

/* ---- çizim ---- */
function cizGiris(bekliyor){
  app.innerHTML = `<div class="giris">
    <span class="kas">Yayın akışı</span>
    <h1>Ekip şifresini gir</h1>
    <p>Bu cihaz şifreyi hatırlar, bir daha sormaz.</p>
    <form id="girisform" autocomplete="on">
      <input type="password" id="g-sifre" name="password" autocomplete="current-password" placeholder="Şifre" aria-label="Şifre" ${bekliyor ? "disabled" : ""}>
      <button type="submit" class="birincil" ${bekliyor ? "disabled" : ""}>${bekliyor ? "Açılıyor…" : "Aç"}</button>
      <span class="uyari" role="alert">${esc(girisHata)}</span>
    </form>
  </div>`;
  if (!bekliyor) document.getElementById("g-sifre").focus();
}

function durumYazi(){
  if (durum === "baglanti") return `<span class="durum hata" id="durum" role="status">Bağlantı yok · değişiklikler bu cihazda bekliyor</span>`;
  if (durum === "gonderiliyor") return `<span class="durum" id="durum" role="status">Kaydediliyor…</span>`;
  return `<span class="durum ok" id="durum" role="status">Kaydedildi</span>`;
}
function ustDurum(){ const el = document.getElementById("durum"); if (el) el.outerHTML = durumYazi(); }

function etiketler(i){
  if (!i.etiket?.length) return "";
  return `<span class="etiket">${i.etiket.map((e, k) => {
    const c = k === 0 && i.acil ? "acil" : (i.bekle && k === i.etiket.length - 1 ? "bekle" : "");
    return `<span class="${c}">${esc(e)}</span>`;
  }).join(" · ")}</span>`;
}

function isSatiri(i){
  if (form?.id === i.id && form.tur === "is") return formIs();
  if (form?.id === i.id && form.tur === "devret") return formDevret(i);
  return `<div class="is ${i.done ? "bitti" : ""}">
    <label class="tikalan"><input type="checkbox" id="is-${i.id}" data-is="${i.id}" ${i.done ? "checked" : ""} aria-label="${esc(i.baslik)} bitti"></label>
    <div class="metin"><span class="baslik">${esc(i.baslik)}</span>${i.detay ? `<span class="detay">${esc(i.detay)}</span>` : ""}${etiketler(i)}${i.devir && !i.done ? `<span class="devir">${esc(i.devir)} devredildi</span>` : ""}</div>
    <div class="eylemler">
      <button type="button" class="duzenle" data-eylem="duzenle" data-id="${i.id}" aria-label="${esc(i.baslik)} işini düzenle">düzenle</button>
      ${i.done ? "" : `<button type="button" class="duzenle" data-eylem="devret" data-id="${i.id}" aria-label="${esc(i.baslik)} işini devret">devret</button>`}
    </div>
  </div>`;
}

function gunlerHTML(isler){
  return gunGruplari(isler).map(g => {
    const e = gunEtiket(g), simdi = bugunIcinde(g.tarih, g.bitis);
    return `<div class="gun ${simdi ? "bugun" : ""}">
      <div class="tarih"><span class="g">${simdi && !g.bitis ? "Bugün" : esc(e.g)}</span><span class="t mono">${esc(e.t)}</span></div>
      <div class="isler">${[...g.isler.filter(i => !i.done), ...g.isler.filter(i => i.done)].map(isSatiri).join("")}</div>
    </div>`;
  }).join("");
}

function ozet(isler){
  const acikS = isler.filter(i => !i.done).length, biten = isler.length - acikS;
  const acil = isler.filter(i => !i.done && i.acil).length;
  if (!isler.length) return "iş yok";
  return [acikS ? `${acikS} açık` : "", biten ? `${biten} bitti` : "", acil ? `<span class="acil">${acil} acil</span>` : ""].filter(Boolean).join(" · ");
}

function haftaHTML(anahtar, ad, isler, simdi, varsayilanTarih){
  const ac = acik.has(anahtar);
  const ekleForm = form?.tur === "is" && !form.id && form.hafta === anahtar;
  return `<div class="hafta ${ac ? "acik" : ""}">
    <button type="button" class="hafta-bas" data-hafta="${anahtar}" aria-expanded="${ac}">
      <span class="okisaret" aria-hidden="true"></span>
      <span class="hafta-ad">${esc(ad)}${simdi ? `<span class="simdi">Bu hafta</span>` : ""}</span>
      <span class="hafta-ozet mono">${ozet(isler)}</span>
    </button>
    ${ac ? `<div class="hafta-ic">
      ${isler.length ? gunlerHTML(isler) : `<div class="bos">Bu hafta için iş yok.</div>`}
      ${ekleForm ? formIs() : `<button type="button" class="ekle" data-eylem="isekle" data-hafta="${anahtar}" data-tarih="${varsayilanTarih || ""}">+ İş ekle</button>`}
    </div>` : ""}
  </div>`;
}

function ayListesi(){
  const k = new Set([ayAnahtar(new Date()), ayKaydir(ayAnahtar(new Date()), 1), secAy]);
  for (const i of S.isler) k.add(isAy(i));
  for (const b of S.bekleyenler) if (b.ay) k.add(b.ay);
  const s = [...k].filter(Boolean).sort();
  const liste = [];
  for (let a = s[0]; a <= s[s.length - 1]; a = ayKaydir(a, 1)) liste.push(a);
  return liste;
}

function ciz(){
  if (!S) return cizGiris();
  const ayIsler = S.isler.filter(i => isAy(i) === secAy);
  const biten = ayIsler.filter(i => i.done).length, toplam = ayIsler.length;
  const bk = S.bekleyenler.filter(b => (b.ay || secAy) === secAy);
  const acikBk = bk.filter(b => !b.geldi).length;
  const [y, m] = secAy.split("-").map(Number);

  const hs = haftalar(secAy);
  const haftaIcin = h => ayIsler.filter(i => i.tarih && i.tarih >= h.bas && i.tarih <= h.bit);
  const tarihsiz = ayIsler.filter(i => !i.tarih);

  app.innerHTML = `
  <header>
    <nav class="aylar" aria-label="Aylar">${ayListesi().map(a => `<button type="button" class="ay" data-ay="${a}" aria-current="${a === secAy}">${esc(ayAdi(a))}</button>`).join("")}</nav>
    <h1>${esc(AYLAR[m - 1])} ${y}</h1>
    <div class="meta">
      <span><b class="mono">${biten}/${toplam}</b> iş bitti</span>
      <span><b class="mono">${acikBk}</b> girdi bekleniyor</span>
      ${durumYazi()}
    </div>
    <div class="cubuk" aria-hidden="true"><i style="width:${toplam ? biten / toplam * 100 : 0}%"></i></div>
    ${bilgi ? `<div class="bilgi" role="status"><span>${esc(bilgi.metin)}</span>${bilgi.ay && bilgi.ay !== secAy ? `<button type="button" data-ay="${bilgi.ay}">${esc(ek(AYLAR[+bilgi.ay.slice(5) - 1], "e"))} git</button>` : ""}</div>` : ""}
  </header>

  <section>
    <h2><span>Beklenenler</span></h2>
    <div class="liste">${bk.map(b => `
      ${form?.tur === "bk" && form.id === b.id ? formBk() : `<div class="bk ${b.geldi ? "geldi" : ""}">
        <button type="button" class="tik" data-bk="${b.id}" id="bk-${b.id}" aria-pressed="${b.geldi}" aria-label="${esc(b.kim)} geldi"><span></span></button>
        <div class="bkmetin">
          <span class="kim">${esc(b.kim)}</span>
          <span class="son mono">${b.geldi ? "geldi" : esc(b.son)}</span>
          ${b.ne ? `<span class="ne">${esc(b.ne)}</span>` : ""}
        </div>
        <button type="button" class="duzenle" data-eylem="bkduzenle" data-id="${b.id}" aria-label="${esc(b.kim)} satırını düzenle">düzenle</button>
      </div>`}`).join("")}
    </div>
    ${!bk.length && form?.tur !== "bk" ? `<div class="bos">Bu ay beklenen bir şey yok.</div>` : ""}
    ${form?.tur === "bk" && !form.id ? formBk() : `<button type="button" class="ekle" data-eylem="bkekle">+ Beklenen ekle</button>`}
  </section>

  <section>
    <h2><span>Haftalar</span><span class="mono">${esc(AYLAR[m - 1])}</span></h2>
    <div class="haftalar">
      ${hs.map(h => haftaHTML(h.anahtar, h.ad, haftaIcin(h), bugunIcinde(h.bas, h.bit),
          bugunIcinde(h.bas, h.bit) ? bugun() : h.bas)).join("")}
      ${haftaHTML("tarihsiz-" + secAy, "Tarihi belli değil", tarihsiz, false, "")}
    </div>
  </section>

  <button type="button" class="cikis" data-eylem="cikis">Bu cihazda çıkış yap</button>`;

  const tz = document.getElementById("f-tarihsiz");
  if (tz) {
    const esle = () => { document.getElementById("f-tarihler").hidden = tz.checked; };
    tz.addEventListener("change", esle); esle();
  }
  document.querySelector('.ay[aria-current="true"]')?.scrollIntoView({ block: "nearest", inline: "center" });
}

function formIs(){
  const bul = form.id ? S.isler.find(x => x.id === form.id) : null;
  const i = bul || { baslik: "", detay: "", etiket: [], acil: false, bekle: 0, tarih: form.tarih || null, bitis: null };
  return `<form class="form" id="isform" autocomplete="off">
    <label class="alan">İş<input type="text" id="f-baslik" value="${esc(i.baslik)}" placeholder="Örn. Boombox story serisi"></label>
    <label class="alan">Not<textarea id="f-detay" placeholder="İsteğe bağlı">${esc(i.detay)}</textarea></label>
    <div class="ikili" id="f-tarihler">
      <label class="alan">Tarih<input type="date" id="f-tarih" value="${esc(i.tarih || "")}"></label>
      <label class="alan">Bitiş (birkaç gün sürecekse)<input type="date" id="f-bitis" value="${esc(i.bitis || "")}"></label>
    </div>
    <div class="secim"><label><input type="checkbox" id="f-tarihsiz" ${i.tarih ? "" : "checked"}> Tarihi belli değil</label></div>
    <label class="alan">Etiketler<input type="text" id="f-etiket" value="${esc((i.etiket || []).join(", "))}" placeholder="Virgülle: Bugün, Boombox"></label>
    <div class="secim">
      <label><input type="checkbox" id="f-acil" ${i.acil ? "checked" : ""}> Acil</label>
      <label><input type="checkbox" id="f-bekle" ${i.bekle ? "checked" : ""}> Bir şey bekleniyor</label>
    </div>
    <div class="alt">
      <button type="submit" class="birincil">${bul ? "Kaydet" : "Ekle"}</button>
      <button type="button" class="ikincil" data-eylem="vazgec">Vazgeç</button>
      <span class="uyari" id="f-uyari" role="alert"></span>
      ${bul ? `<button type="button" class="ikincil sil" data-eylem="issil">Sil</button>` : ""}
    </div>
  </form>`;
}

function formDevret(i){
  const temel = i.tarih ? tarihOku(i.tarih) : new Date();
  const oneri = iso(gunEkle(temel, 7));
  const yarin = iso(gunEkle(new Date(), 1));
  const gHafta = iso(gunEkle(pazartesi(new Date()), 7));
  const gAy = ayKaydir(isAy(i) || secAy, 1) + "-01";
  return `<form class="form" id="devretform" autocomplete="off">
    <p class="soru"><b>${esc(i.baslik)}</b> hangi tarihe devredilsin?</p>
    <div class="hizli">
      <button type="button" data-devir-tarih="${yarin}">Yarın</button>
      <button type="button" data-devir-tarih="${gHafta}">Gelecek hafta</button>
      <button type="button" data-devir-tarih="${gAy}">${esc(AYLAR[tarihOku(gAy).getMonth()])} başı</button>
    </div>
    <label class="alan">Yeni tarih<input type="date" id="d-tarih" value="${oneri}"></label>
    <div class="alt">
      <button type="submit" class="birincil">Devret</button>
      <button type="button" class="ikincil" data-eylem="vazgec">Vazgeç</button>
      <span class="uyari" id="d-uyari" role="alert"></span>
    </div>
  </form>`;
}

function formBk(){
  const b = form.id ? S.bekleyenler.find(x => x.id === form.id) : null;
  const v = b || { kim: "", ne: "", son: "" };
  return `<form class="form" id="bkform" autocomplete="off">
    <div class="ikili">
      <label class="alan">Beklenen<input type="text" id="b-kim" value="${esc(v.kim)}" placeholder="Örn. Karadağ tarihleri"></label>
      <label class="alan">Son gün<input type="text" id="b-son" value="${esc(v.son)}" placeholder="Örn. 17 Eyl"></label>
    </div>
    <label class="alan">Kimden / not<input type="text" id="b-ne" value="${esc(v.ne)}" placeholder="Örn. Onur gönderecek"></label>
    <div class="alt">
      <button type="submit" class="birincil">${b ? "Kaydet" : "Ekle"}</button>
      <button type="button" class="ikincil" data-eylem="vazgec">Vazgeç</button>
      <span class="uyari" id="b-uyari" role="alert"></span>
      ${b ? `<button type="button" class="ikincil sil" data-eylem="bksil" data-id="${b.id}">Sil</button>` : ""}
    </div>
  </form>`;
}

/* ---- eylemler ---- */
function haftaAc(anahtar){ acik.add(anahtar); depo(K_ACIK, JSON.stringify([...acik].slice(-40))); }
function haftaAnahtari(i){ return i.tarih ? iso(pazartesi(tarihOku(i.tarih))) : "tarihsiz-" + i.ay; }
function formKapat(){ form = null; if (!kuyruk().length && !gonderiliyor) yeniden(); ciz(); }

function isKaydet(){
  const deger = id => document.getElementById(id).value.trim();
  const uyar = m => { document.getElementById("f-uyari").textContent = m; };
  const baslik = deger("f-baslik");
  if (!baslik) return uyar("İşin adını yaz.");
  const tarihsiz = document.getElementById("f-tarihsiz").checked;
  let tarih = tarihsiz ? null : deger("f-tarih") || null, bitis = tarihsiz ? null : deger("f-bitis") || null;
  if (!tarihsiz && !tarih) return uyar("Tarih seç ya da “Tarihi belli değil”i işaretle.");
  if (bitis && bitis <= tarih) bitis = null;
  const bul = form.id ? S.isler.find(x => x.id === form.id) : null;
  const veri = {
    baslik, detay: deger("f-detay"), tarih, bitis,
    ay: tarih ? null : (bul?.tarih ? bul.tarih.slice(0, 7) : bul?.ay || secAy),
    etiket: deger("f-etiket").split(",").map(x => x.trim()).filter(Boolean),
    acil: document.getElementById("f-acil").checked,
    bekle: document.getElementById("f-bekle").checked ? 1 : 0,
  };
  form = null;
  const hedef = { ...veri };
  haftaAc(haftaAnahtari(hedef));
  const hedefAy = isAy(hedef);
  bilgi = hedefAy !== secAy ? { metin: `“${baslik}” ${ek(AYLAR[+hedefAy.slice(5) - 1], "e")} eklendi.`, ay: hedefAy } : null;
  if (bul) degistir({ t: "is", id: bul.id, veri });
  else degistir({ t: "is", id: yeniId("i"), yeni: true, veri: { ...veri, done: false } });
}

function devret(){
  const i = S.isler.find(x => x.id === form.id); if (!i) return formKapat();
  const yeni = document.getElementById("d-tarih").value;
  if (!yeni) { document.getElementById("d-uyari").textContent = "Yeni tarihi seç."; return; }
  let bitis = null;
  if (i.tarih && i.bitis) {
    const sure = Math.round((tarihOku(i.bitis) - tarihOku(i.tarih)) / 864e5);
    bitis = iso(gunEkle(tarihOku(yeni), sure));
  }
  const nereden = i.tarih ? ek(kisaTarih(i.tarih), "den") : ek(AYLAR[+i.ay.slice(5) - 1], "den");
  const veri = { tarih: yeni, bitis, ay: null, done: false, devir: nereden };
  form = null;
  haftaAc(iso(pazartesi(tarihOku(yeni))));
  const hedefAy = yeni.slice(0, 7);
  bilgi = { metin: `“${i.baslik}” ${ek(kisaTarih(yeni), "e")} devredildi.`, ay: hedefAy };
  degistir({ t: "is", id: i.id, veri });
}

app.addEventListener("change", e => {
  const id = e.target.dataset?.is; if (!id) return;
  degistir({ t: "is", id, veri: { done: e.target.checked } });
  document.getElementById("is-" + id)?.focus();
});

app.addEventListener("submit", async e => {
  e.preventDefault();
  if (e.target.id === "girisform") {
    const deneme = document.getElementById("g-sifre").value.trim();
    if (!deneme) return;
    cizGiris(true);
    try { girisHata = ""; await giris(deneme); }
    catch (err) { girisHata = hataMesaji(err); if (err.kod === "cizim" && tazeYukle(err.asil)) return; cizGiris(); }
    return;
  }
  if (e.target.id === "isform") return isKaydet();
  if (e.target.id === "devretform") return devret();
  if (e.target.id === "bkform") {
    const v = id => document.getElementById(id).value.trim();
    const kim = v("b-kim");
    if (!kim) { document.getElementById("b-uyari").textContent = "Neyin beklendiğini yaz."; return; }
    const id = form.id, veri = { kim, ne: v("b-ne"), son: v("b-son") };
    form = null;
    if (id) degistir({ t: "bk", id, veri });
    else degistir({ t: "bk", id: yeniId("b"), yeni: true, veri: { ...veri, ay: secAy, geldi: false } });
  }
});

app.addEventListener("click", e => {
  const hb = e.target.closest("[data-hafta]");
  if (hb) {
    const k = hb.dataset.hafta;
    if (acik.has(k)) acik.delete(k); else acik.add(k);
    depo(K_ACIK, JSON.stringify([...acik].slice(-40)));
    if (form?.hafta === k) form = null;
    return ciz();
  }
  const ay = e.target.closest("[data-ay]");
  if (ay) { secAy = ay.dataset.ay; form = null; bilgi = null; return formKapat(); }
  const dt = e.target.closest("[data-devir-tarih]");
  if (dt) { document.getElementById("d-tarih").value = dt.dataset.devirTarih; return; }
  const ey = e.target.closest("[data-eylem]");
  if (ey) {
    const d = ey.dataset;
    bilgi = null;
    if (d.eylem === "isekle") {
      form = { tur: "is", id: null, hafta: ey.closest(".hafta").querySelector("[data-hafta]").dataset.hafta, tarih: d.tarih || null };
      ciz(); document.getElementById("f-baslik")?.focus();
    }
    else if (d.eylem === "duzenle") { form = { tur: "is", id: d.id }; ciz(); document.getElementById("f-baslik")?.focus(); }
    else if (d.eylem === "devret") { form = { tur: "devret", id: d.id }; ciz(); }
    else if (d.eylem === "vazgec") formKapat();
    else if (d.eylem === "issil") { const id = form.id; form = null; degistir({ t: "issil", id }); }
    else if (d.eylem === "bkduzenle") { form = { tur: "bk", id: d.id }; ciz(); document.getElementById("b-kim")?.focus(); }
    else if (d.eylem === "bkekle") { form = { tur: "bk", id: null }; ciz(); document.getElementById("b-kim")?.focus(); }
    else if (d.eylem === "bksil") { form = null; degistir({ t: "bksil", id: d.id }); }
    else if (d.eylem === "cikis") cikis();
    return;
  }
  const btn = e.target.closest("[data-bk]"); if (!btn) return;
  const b = S.bekleyenler.find(x => x.id === btn.dataset.bk); if (!b) return;
  degistir({ t: "bk", id: b.id, veri: { geldi: !b.geldi } });
  document.getElementById("bk-" + b.id)?.focus();
});

/* Tarayıcı eski sayfayı önbellekte tutarsa yeni sürümü kendisi yükler (şifre ve bekleyen tikler korunur). */
async function guncelMi(){
  if (form || gonderiliyor || kuyruk().length) return;
  try {
    const r = await fetch("surum.txt?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return;
    const yeni = (await r.text()).trim();
    if (!yeni || yeni === SURUM) return;
    let son = 0;
    try { son = +sessionStorage.getItem("akis-yenile") || 0; } catch {}
    if (Date.now() - son < 45000) return;
    try { sessionStorage.setItem("akis-yenile", Date.now()); } catch {}
    location.replace(location.pathname + "?v=" + encodeURIComponent(yeni) + "-" + Date.now());
  } catch {}
}
if (new URLSearchParams(location.search).has("v")) history.replaceState(null, "", location.pathname);

document.addEventListener("visibilitychange", () => { if (!document.hidden) { guncelMi(); yokla(); gonder(); } });
window.addEventListener("online", () => gonder());
setInterval(yokla, 4000);
setInterval(guncelMi, 60000);
guncelMi();

if (sifre) {
  app.innerHTML = `<div class="giris"><span class="kas">Yayın akışı</span><p>Açılıyor…</p></div>`;
  giris(sifre).catch(err => {
    if (err.kod === "sifre_yanlis") return cikis("Şifre değişmiş, yenisini gir.");
    if (err.kod === "cizim" && tazeYukle(err.asil)) return;
    girisHata = hataMesaji(err); cizGiris();
  });
} else cizGiris();
</script>
</body>
</html>
